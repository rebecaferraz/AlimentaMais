{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Plano · Alimenta+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --g9:    #1B4D2E;
      --g7:    #2a6b42;
      --g2:    #b8dfc8;
      --g1:    #e8f5ee;
      --gold:  #C5A059;
      --goldd: #9a7b3e;
      --ink:   #1A1A1A;
      --muted: #6b7280;
      --off:   #F5F5F5;
      --white: #ffffff;
      --r:     12px;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--off);
      color: var(--ink);
      min-height: 100vh;
    }

    .navbar {
      background: var(--g9);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar-brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: .15em;
    }

    .navbar-brand span { color: var(--gold); }

    .navbar-back {
      color: rgba(255,255,255,.8);
      font-size: .75rem;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.2);
      padding: .4rem .9rem;
      border-radius: 6px;
      transition: background .15s;
    }

    .navbar-back:hover { background: rgba(255,255,255,.1); }

    .container {
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1.5rem 3rem;
    }

    .page-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: .4rem;
    }

    .page-sub {
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .card {
      background: var(--white);
      border-radius: var(--r);
      border: 1px solid rgba(27,77,46,.1);
      padding: 1.8rem;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: .9rem;
      font-weight: 700;
      color: var(--g9);
      margin-bottom: 1.2rem;
      padding-bottom: .6rem;
      border-bottom: 2px solid var(--g2);
    }

    .form-group { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: .67rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: .38rem;
    }

    input, select, textarea {
      width: 100%;
      padding: .62rem .85rem;
      border: 1.5px solid rgba(0,0,0,.1);
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: .8rem;
      color: var(--ink);
      background: #FAFAFA;
      outline: none;
      transition: border-color .15s;
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--g7);
      background: var(--white);
    }

    textarea { min-height: 70px; resize: vertical; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .75rem;
    }

    /* REFEIÇÕES */
    .refeicao-block {
      background: var(--off);
      border-radius: 8px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(0,0,0,.06);
      position: relative;
    }

    .refeicao-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .8rem;
    }

    .refeicao-num {
      font-size: .7rem;
      font-weight: 700;
      color: var(--g9);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #b91c1c;
      cursor: pointer;
      font-size: .7rem;
      font-weight: 600;
      padding: .2rem .5rem;
      border-radius: 4px;
      transition: background .15s;
    }

    .btn-remove:hover { background: #fef2f2; }

    .btn-add {
      display: block;
      width: 100%;
      padding: .7rem;
      background: var(--g1);
      color: var(--g9);
      border: 1.5px dashed var(--g2);
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .15s;
      text-align: center;
    }

    .btn-add:hover { background: var(--g2); }

    .btn-submit {
      display: block;
      width: 100%;
      padding: .9rem;
      background: var(--gold);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-submit:hover { background: var(--goldd); }

    /* MENSAGENS */
    .messages { margin-bottom: 1.2rem; }

    .msg {
      padding: .65rem .9rem;
      border-radius: 8px;
      font-size: .78rem;
      font-weight: 500;
      margin-bottom: .5rem;
    }

    .msg-error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .msg-success { background: var(--g1); color: var(--g9); border: 1px solid var(--g2); }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">ALIMENTA<span>+</span></div>
  <a href="{% url 'painel_nutricionista' %}" class="navbar-back">← Voltar ao painel</a>
</nav>

<div class="container">

  {% if messages %}
  <div class="messages">
    {% for message in messages %}
      <div class="msg {% if message.tags == 'error' %}msg-error{% else %}msg-success{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
  {% endif %}

  <div class="page-title">Criar Plano Alimentar</div>
  <div class="page-sub">Defina o título, o paciente e as refeições do plano.</div>

  <form method="POST">
    {% csrf_token %}

    <!-- DADOS GERAIS -->
    <div class="card">
      <div class="card-title">Dados do Plano</div>

      <div class="form-group">
        <label for="titulo">Título do Plano</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ex: Plano de Emagrecimento — Março" required>
      </div>

      <div class="form-group">
        <label for="paciente_id">Paciente</label>
        <select id="paciente_id" name="paciente_id" required>
          <option value="">Selecione um paciente</option>
          {% for p in pacientes %}
          <option value="{{ p.id }}">{{ p.nome }} — {{ p.email }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- REFEIÇÕES -->
    <div class="card">
      <div class="card-title">Refeições</div>

      <div id="refeicoes-container">
        <div class="refeicao-block">
          <div class="refeicao-header">
            <span class="refeicao-num">Refeição 1</span>
          </div>
          <div class="form-group">
            <label>Nome da Refeição</label>
            <input type="text" name="refeicao_nome" placeholder="Ex: Café da manhã" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Horário</label>
              <input type="time" name="refeicao_horario" required>
            </div>
            <div class="form-group">
              <label>Dia da Semana</label>
              <select name="refeicao_dia" required>
                <option value="seg">Segunda-feira</option>
                <option value="ter">Terça-feira</option>
                <option value="qua">Quarta-feira</option>
                <option value="qui">Quinta-feira</option>
                <option value="sex">Sexta-feira</option>
                <option value="sab">Sábado</option>
                <option value="dom">Domingo</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Descrição / Alimentos</label>
            <textarea name="refeicao_descricao" placeholder="Ex: 2 fatias de pão integral, 1 ovo mexido, suco de laranja" required></textarea>
          </div>
        </div>
      </div>

      <button type="button" class="btn-add" onclick="adicionarRefeicao()">+ Adicionar Refeição</button>
    </div>

    <button type="submit" class="btn-submit">Salvar Plano Alimentar</button>
  </form>

</div>

<script>
  let count = 1;

  function adicionarRefeicao() {
    count++;
    const container = document.getElementById('refeicoes-container');
    const div = document.createElement('div');
    div.className = 'refeicao-block';
    div.innerHTML = `
      <div class="refeicao-header">
        <span class="refeicao-num">Refeição ${count}</span>
        <button type="button" class="btn-remove" onclick="this.closest('.refeicao-block').remove()">Remover</button>
      </div>
      <div class="form-group">
        <label>Nome da Refeição</label>
        <input type="text" name="refeicao_nome" placeholder="Ex: Almoço" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Horário</label>
          <input type="time" name="refeicao_horario" required>
        </div>
        <div class="form-group">
          <label>Dia da Semana</label>
          <select name="refeicao_dia" required>
            <option value="seg">Segunda-feira</option>
            <option value="ter">Terça-feira</option>
            <option value="qua">Quarta-feira</option>
            <option value="qui">Quinta-feira</option>
            <option value="sex">Sexta-feira</option>
            <option value="sab">Sábado</option>
            <option value="dom">Domingo</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Descrição / Alimentos</label>
        <textarea name="refeicao_descricao" placeholder="Descreva os alimentos desta refeição" required></textarea>
      </div>
    `;
    container.appendChild(div);
  }
</script>

</body>
</html>
